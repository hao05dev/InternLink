services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: internlink-postgres
    restart: always
    environment:
      POSTGRES_DB: internlink_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD phải được đặt trong .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-service:
    # Repo AI nằm cạnh repo backend (cùng thư mục cha)
    build:
      context: ../Internlink-v1-ai
      dockerfile: Dockerfile
    container_name: internlink-ai-service
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ../Internlink-v1-ai/.env
    volumes:
      - ../Internlink-v1-ai/app:/app/app:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
