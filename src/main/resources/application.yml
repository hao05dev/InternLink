server:
  port: 8080

spring:
  application:
    name: internlink-backend-core
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internlink_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:hp12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 30
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

internlink:
  google:
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
    gmail-sender: ${GOOGLE_GMAIL_SENDER:}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: /
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
    upload-capacity: ${RATE_LIMIT_UPLOAD_CAPACITY:15}
    ai-capacity: ${RATE_LIMIT_AI_CAPACITY:20}
    default-capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:120}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    api-key: ${AI_SERVICE_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  storage:
    active-provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    google-drive:
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
      service-account-key-path: ${GOOGLE_DRIVE_KEY_PATH:}
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      prefix: ${R2_PREFIX:internlink}
      max-file-bytes: 20971520
      direct-enabled: ${R2_DIRECT_UPLOAD_ENABLED:false}
      presigned-seconds: ${R2_PRESIGNED_SECONDS:300}
      cleanup-enabled: ${R2_CLEANUP_ENABLED:false}
    scanner:
      enabled: ${UPLOAD_SCAN_ENABLED:false}
      host: ${CLAMAV_HOST:127.0.0.1}
      port: ${CLAMAV_PORT:3310}
  email:
    enabled: ${EMAIL_ENABLED:false}
    provider: ${EMAIL_PROVIDER:DISABLED}
    from: ${EMAIL_FROM:}
    smtp-username: ${GMAIL_SMTP_USERNAME:}
    smtp-app-password: ${GMAIL_SMTP_APP_PASSWORD:}
    public-base-url: ${APP_PUBLIC_URL:http://localhost:3000}
    max-attempts: 5
    poll-interval-ms: 15000

notifications:
  realtime-enabled: ${NOTIFICATION_REALTIME_ENABLED:true}
  reminders-enabled: ${NOTIFICATION_REMINDERS_ENABLED:false}
  campaigns-enabled: ${NOTIFICATION_CAMPAIGNS_ENABLED:false}
