server:
  port: 8080

spring:
  application:
    name: internlink-backend-core
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:internlink_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:hp12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

internlink:
  google:
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
    gmail-sender: ${GOOGLE_GMAIL_SENDER:}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  storage:
    active-provider: ${STORAGE_PROVIDER:LOCAL}
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    google-drive:
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
      service-account-key-path: ${GOOGLE_DRIVE_KEY_PATH:}
