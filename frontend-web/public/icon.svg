  <circle cx="37" cy="30.5" r="2.2" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5" />

  <!-- Center Active Node -->
  <circle cx="24" cy="18.5" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />
</svg>
